version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: civiclens-postgis
    restart: always
    environment:
      POSTGRES_DB: civiclens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5432:5432'
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./api/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d civiclens']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: civiclens-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/civiclens
      JWT_SECRET: civiclens-local-docker-cluster-secret-2026
    ports:
      - '4000:4000'

volumes:
  postgis_data:

name: CI Pipeline

on:
  push:
    branches: [main, master, binit]
  pull_request:
    branches: [main, master, binit]

jobs:
  test-api:
    name: API Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API Dependencies
        working-directory: api
        run: npm ci

      - name: TypeScript Build
        working-directory: api
        run: npm run build

      - name: Run API Tests
        working-directory: api
        run: npm test

  test-app:
    name: Frontend PWA Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install App Dependencies
        working-directory: app
        run: npm ci

      - name: Run Linter
        working-directory: app
        run: npm run lint

      - name: Run Unit Tests
        working-directory: app
        run: npm test

      - name: Production Build
        working-directory: app
        run: npm run build

name: Keep-Alive Pinger (Supabase + Render)

on:
  schedule:
    # Every 4 days at 06:00 UTC to prevent Supabase 7-day pause and Render cold starts
    - cron: '0 6 */4 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          echo "Pinging Render API..."
          curl -sf --max-time 60 "${{ secrets.RENDER_API_URL || 'https://civiclens-api.onrender.com' }}/api/health" || echo "Render ping failed (may be cold-starting)"

      - name: Ping Supabase Project
        run: |
          echo "Pinging Supabase..."
          curl -sf --max-time 30 "${{ secrets.SUPABASE_URL || 'https://fzcmthmjrwmvntvnrzfy.supabase.co' }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}" || echo "Supabase ping failed (project may be paused)"
